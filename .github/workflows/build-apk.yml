name: Compiler l'APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marees-Lacanau.apk

      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: Marees-Lacanau-APK
          path: Marees-Lacanau.apk
